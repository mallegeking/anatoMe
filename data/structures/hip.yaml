- {id: adductor-longus, type: muscle, english: Adductor longus, latin: Adductor longus, fma: "FMA22441", region: hip, depth: 1, depth_note: "Wikipedia, Adductor brevis muscle (read 2026-11-03): adductor brevis lies deep to pectineus and adductor longus, so these two are the outer layer of the inner thigh."}
