- {id: psoas-major, type: muscle, english: Psoas major, latin: Psoas major, fma: "FMA18060", region: hip, depth: 1, depth_note: "Wikipedia, Iliopsoas (read 2026-11-03): below the inguinal ligament it forms part of the floor of the femoral triangle, like pectineus, so it gets the layer of pectineus."}
