# One entry per structure in the hip region that has a mesh.
# id is the sid in the glTF extras. latin is from Z-Anatomy's TA2.csv and fma from
# the BodyParts3D parts lists, each left out when the source has none.
# On 2026-11-03 every latin was checked against FIPAT Terminologia Anatomica 2 in the TA2 Viewer
# (https://ta2viewer.openanatomy.org). All matched a TA2 term except the hip joint capsule, which has
# no term of its own in TA2, so it keeps its name. The posterior cruciate ligament got its TA2 name.
# Built from pipeline/assets/regions/hip.json on 2026-11-02.
# depth is the layer from the skin inwards, 1 is the outermost and bones are 4. Peeling a layer
# hides the lowest depth still shown. Added by hand on 2026-11-03. Every muscle has a depth_note
# with its source. Ligaments, capsule, labrum and bursae take the depth of the layer they sit in:
# the bursae of gluteus maximus and iliopsoas lie under those muscles, the joint parts lie deep.
# gap names a part of the structure that the model does not show yet. The app shows the text
# gap.<value> from the language file. The quadriceps share a tendon that has no mesh, and the
# vertebrae are not modelled, so psoas major has no origin.
# German names from DocCheck Flexikon and German Wikipedia, one article per structure or the hip, knee and meniscus articles, read on 2026-11-14. german is left out where no opened source gave one.
# also_in lists the other regions that draw this bone too.
- {id: hip-bone, type: bone, english: Hip bone, german: Hüftbein, latin: Os coxae, fma: "FMA16585", region: hip, also_in: [trunk], depth: 4}
