# One entry per structure in the hip region that has a mesh.
# id is the sid in the glTF extras. latin is from Z-Anatomy's TA2.csv and fma from
# the BodyParts3D parts lists, each left out when the source has none.
# Built from pipeline/assets/regions/hip.json on 2026-11-02.
# depth is the layer from the skin inwards, 1 is the outermost and bones are 4. Peeling a layer
# hides the lowest depth still shown. Added by hand on 2026-11-03. Every muscle has a depth_note
# with its source. Ligaments, capsule, labrum and bursae take the depth of the layer they sit in:
# the bursae of gluteus maximus and iliopsoas lie under those muscles, the joint parts lie deep.
- {id: hip-bone, type: bone, english: Hip bone, latin: Os coxae, fma: "FMA16585", region: hip, depth: 4}
