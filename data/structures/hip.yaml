- {id: inferior-gemellus, type: muscle, english: Inferior gemellus, latin: Musculus gemellus inferior, fma: "FMA22320", region: hip, depth: 2, depth_note: "OERI Human Anatomy 10.7: deep to gluteus maximus, like the other lateral rotators."}
- {id: obturator-internus, type: muscle, english: Obturator internus, latin: Obturator internus, fma: "FMA22298", region: hip, depth: 2, depth_note: "OERI Human Anatomy 10.7: deep to gluteus maximus, like the other lateral rotators."}
- {id: obturator-externus, type: muscle, english: Obturator externus, latin: Obturator externus, fma: "FMA22299", region: hip, depth: 3, depth_note: "OERI Human Anatomy 10.7: deep to gluteus maximus. Wikipedia, External obturator muscle (read 2026-11-03): covers the outer surface of the front wall of the pelvis and its tendon runs across the back of the femoral neck and hip capsule, so it gets the deepest layer."}
- {id: quadratus-femoris, type: muscle, english: Quadratus femoris, latin: Musculus quadratus femoris, fma: "FMA22321", region: hip, depth: 2, depth_note: "OERI Human Anatomy 10.7: deep to gluteus maximus, like the other lateral rotators."}
