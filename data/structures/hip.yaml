- {id: adductor-magnus, type: muscle, english: Adductor magnus, latin: Adductor magnus, fma: "FMA22443", region: hip, depth: 3, depth_note: "Wikipedia, Adductor magnus muscle (read 2026-11-03): its front surface lies against pectineus, adductor brevis and adductor longus, its back surface against the hamstrings and gluteus maximus, so it is the deepest inner thigh muscle."}
- {id: gracilis, type: muscle, english: Gracilis, latin: Musculus gracilis, fma: "FMA43882", region: hip, depth: 1, depth_note: "Wikipedia, Gracilis muscle (read 2026-11-03): the most superficial muscle on the medial side of the thigh."}
- {id: sartorius, type: muscle, english: Sartorius, latin: Musculus sartorius, fma: "FMA22353", region: hip, depth: 1, depth_note: "Wikipedia, Sartorius muscle (read 2026-11-03): a long, thin, superficial muscle of the front of the thigh."}
- {id: rectus-femoris, type: muscle, english: Rectus femoris, latin: Musculus rectus femoris, fma: "FMA22430", region: hip, depth: 1, depth_note: "OERI Human Anatomy 10.7: on the front of the thigh, with vastus intermedius deep to it."}
