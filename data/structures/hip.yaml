- {id: biceps-femoris-short-head, type: muscle, english: "Biceps femoris, short head", latin: Caput breve musculi bicipitis femoris, fma: "FMA45890", region: hip, depth: 2, depth_note: "Wikipedia, Biceps femoris muscle (read 2026-11-03): arises from the linea aspera of the femur, between adductor magnus and vastus lateralis, under the long head. Our reading of the described course."}
