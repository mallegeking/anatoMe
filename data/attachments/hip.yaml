# Where each hip muscle starts (origin) and ends (insertion). One row per end.
# Every row was drafted from the cited sources on 2026-11-03, with each source open while writing.
# All rows wait for the owner to check them against the cited source.
# Each citation is marked quote when says is the source's own words, or summary when it is our own
# short summary. We only quote sources whose licence fits CC BY 4.0. The OERI tables are summarised
# in sentences, the same way as in actions/hip.yaml.
# landmark is plain words. The app adds "of the <bone>" after it.
# Known gaps:
# Psoas major starts on the last thoracic and the lumbar vertebrae, which are not in the hip model,
# so it has no origin row.
# Rows name bones only. Parts that start on a ligament or on fascia have no row of their own, for
# example the gluteus maximus and piriformis fibres from the sacrotuberous ligament.

# Gluteus maximus

- id: gluteus-maximus-origin-ilium
  muscle: gluteus-maximus
  end: origin
  bone: hip-bone
  landmark: back of the ilium, at the posterior gluteal line and iliac crest
  citations:
    - ref: oeri-human-anatomy-10-7
      locator: Table 1 (Gluteal Region Muscles That Move the Femur), row Gluteus maximus, Origin column
      says: "The table gives the origin of gluteus maximus as the dorsal ilium, the sacrum and the coccyx."
      says_kind: summary
    - ref: akamatsu-2017
      locator: 1. Introduction
      says: "It originates in the posterior gluteal line of the ilium, the iliac crest, and the aponeurosis of the erector spinae ..."
      says_kind: quote
  checked_by: null

- id: gluteus-maximus-origin-sacrum
  muscle: gluteus-maximus
  end: origin
  bone: sacrum
  landmark: back surface of the lower part
  citations:
    - ref: oeri-human-anatomy-10-7
      locator: Table 1 (Gluteal Region Muscles That Move the Femur), row Gluteus maximus, Origin column
      says: "The table gives the origin of gluteus maximus as the dorsal ilium, the sacrum and the coccyx."
      says_kind: summary
    - ref: akamatsu-2017
      locator: 1. Introduction
      says: "on the dorsal surface of the lower portion of the sacrum and the lateral aspect of the coccyx"
      says_kind: quote
  checked_by: null

# The coccyx has no mesh of its own. It is part of the sacrum mesh, so this row uses bone sacrum.
- id: gluteus-maximus-origin-coccyx
  muscle: gluteus-maximus
  end: origin
  bone: sacrum
  landmark: side of the coccyx, at the lower tip
  citations:
    - ref: oeri-human-anatomy-10-7
      locator: Table 1 (Gluteal Region Muscles That Move the Femur), row Gluteus maximus, Origin column
      says: "The table gives the origin of gluteus maximus as the dorsal ilium, the sacrum and the coccyx."
      says_kind: summary
    - ref: akamatsu-2017
      locator: 1. Introduction
      says: "on the dorsal surface of the lower portion of the sacrum and the lateral aspect of the coccyx"
      says_kind: quote
    - ref: oeri-human-anatomy-6-4
      locator: Section Sacrum and Coccyx
      says: "The coccyx, or tailbone, is derived from the fusion of four very small coccygeal vertebrae ... It articulates with the inferior tip of the sacrum."
      says_kind: quote
  checked_by: null

- id: gluteus-maximus-insertion-gluteal-tuberosity
  muscle: gluteus-maximus
  end: insertion
  bone: femur
  landmark: gluteal tuberosity
  citations:
    - ref: oeri-human-anatomy-10-7
      locator: Table 1 (Gluteal Region Muscles That Move the Femur), row Gluteus maximus, Insertion column
      says: "The table gives the insertion of gluteus maximus as the gluteal tuberosity of the femur and the iliotibial tract."
      says_kind: summary
    - ref: akamatsu-2017
      locator: 1. Introduction
      says: "The deep fibers of the lower portion are inserted in the gluteal tuberosity, between the vastus lateralis and adductor magnus"
      says_kind: quote
  checked_by: null

# The iliotibial tract is fascia, not bone. This row names the bone where the tract ends.
- id: gluteus-maximus-insertion-iliotibial-tract
  muscle: gluteus-maximus
  end: insertion
  bone: tibia
  landmark: iliotibial tract, which ends on Gerdy's tubercle
  citations:
    - ref: oeri-human-anatomy-10-7
      locator: Table 1 (Gluteal Region Muscles That Move the Femur), row Gluteus maximus, Insertion column
      says: "The table gives the insertion of gluteus maximus as the gluteal tuberosity of the femur and the iliotibial tract."
      says_kind: summary
    - ref: akamatsu-2017
      locator: 1. Introduction
      says: "The fibers of the upper portion of the muscle join the superficial fibers of the lower portion to form a thick tendinous lamina that crosses the greater trochanter and inserts into the iliotibial tract of the fascia lata."
      says_kind: quote
    - ref: bedard-2025
      locator: 1. Introduction
      says: "The iliotibial band (ITB) is formed by the union of the aponeuroses of the gluteus maximus and the tensor fascia lata muscles. ... distally, inserts on the tubercle of iliotibial band (tITB)"
      says_kind: quote
    - ref: bedard-2025
      locator: Abstract, and 4. Discussion
      says: "The abstract places the tubercle of the iliotibial band on the tibia. The Discussion calls the same point Gerdy's tubercle, with the same 3.92 mm shift that the Results give for the tubercle of the iliotibial band."
      says_kind: summary
  checked_by: null

