# Piriformis external rotation shrinks as the hip bends (Ito 2025, Table 2, N m):
# 0.40 at 0°, 0.40 at 15°, 0.32 at 30°, 0.24 at 45°, 0.13 at 60°, 0.05 at 75°.
# Primary up to 45° where it is still sizable, secondary at 60° to 75° where it is small.
# The study measured every 15°, so nothing is claimed between 45° and 60°.
- id: piriformis-hip-external-rotation
  structure: piriformis
  movement: hip-external-rotation
  load: working
  role: primary
  when:
    - {angle: hip.flexion, min: 0, max: 45}
  confidence: medium
  citations:
    - ref: oeri-human-anatomy-10-7
      locator: Table 1 (Gluteal Region Muscles That Move the Femur), Lateral Rotators, row Piriformis
      says: "Piriformis is listed among the lateral rotators, target motion direction: lateral rotation."
      says_kind: summary
    - ref: ito-2025
      locator: Abstract, and Table 2 (external rotation torque at each hip flexion angle, mean ± SD, N m), row Piriformis
      says: "In 15 cadaver hips, the external rotation torque of piriformis was highest at 15° of hip flexion and fell as the hip bent further. Table 2 gives piriformis 0.40 ± 0.17 N m at 0°, 0.40 ± 0.18 at 15°, 0.32 ± 0.10 at 30° and 0.24 ± 0.06 at 45°."
      says_kind: summary
  checked_by: null
  review_note: "Physio: is piriformis a main external rotator up to 45 degrees of hip flexion, or only up to 30? Ito 2025 Table 2 shows obturator externus larger than piriformis from 30 degrees (0.43 vs 0.32 N m) and about twice as large at 45 (0.50 vs 0.24)."

- id: piriformis-hip-external-rotation-flexed
  structure: piriformis
  movement: hip-external-rotation
  load: working
  role: secondary
  when:
    - {angle: hip.flexion, min: 60, max: 75}
  confidence: medium
  citations:
    - ref: ito-2025
      locator: Table 2 (external rotation torque at each hip flexion angle, mean ± SD, N m), rows Piriformis and Obturator externus
      says: "At 60° and 75° of hip flexion piriformis gave only a little external rotation torque, 0.13 ± 0.04 and 0.05 ± 0.03 N m in Table 2. Obturator externus gave 0.54 ± 0.18 and 0.58 ± 0.20 N m at the same angles."
      says_kind: summary
  checked_by: null
  review_note: "Physio: this row depends on the question on the 0 to 45 degree row. If piriformis is a main external rotator only up to 30 degrees, should this secondary row start at 45 instead of 60? Ito 2025 Table 2 gives piriformis 0.24 N m at 45, 0.13 at 60 and 0.05 at 75 degrees."

# role secondary is a judgment, no source says it. Ito's Table 2 torques here are very
# small (-0.02 and -0.06 N m, minus means internal rotation) and the textbook does not
# list piriformis as an internal rotator.
- id: piriformis-hip-internal-rotation
  structure: piriformis
  movement: hip-internal-rotation
  load: working
  role: secondary
  when:
    - {angle: hip.flexion, min: 90, max: 105}
  confidence: medium
  citations:
    - ref: ito-2025
      locator: 3. Results, paragraph on external rotation torque, and Table 2 (external rotation torque, mean ± SD, N m), row Piriformis. Hips were tested from 0° to 105° of flexion.
      says: "Between 75° and 90° of hip flexion piriformis changed from turning the hip outwards to turning it inwards. Table 2 gives piriformis −0.02 ± 0.02 N m at 90° and −0.06 ± 0.03 at 105°, where minus means internal rotation."
      says_kind: summary
  checked_by: null

