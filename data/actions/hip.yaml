# What hip movements do to each structure, and when.
# Every row was drafted from the cited sources on 2026-11-02 and waits for a person to check it.
# Each citation is marked quote when says is the source's own words, or summary when it is our own short summary.
# We only quote sources whose licence fits CC BY 4.0. Ito 2025 and Groh 2009 are CC BY-NC, so their
# says were rewritten as summaries on 2026-11-03, after opening both papers again.
# Angles in when are in degrees, see joints.yaml. All entries in when must hold at once.

- id: gluteus-maximus-hip-extension
  structure: gluteus-maximus
  movement: hip-extension
  load: working
  role: primary
  confidence: high
  citations:
    - ref: oeri-human-anatomy-10-7
      locator: Table 1 (Gluteal Region Muscles That Move the Femur), Gluteal Group, row Gluteus maximus
      says: "Gluteus maximus is listed as a prime mover of the femur, target motion direction: extension."
      says_kind: summary
    - ref: contreras-2015
      locator: Discussion
      says: "presumably resulting from a greater reliance upon the gluteus maximus for hip extension"
      says_kind: quote
  checked_by: null

