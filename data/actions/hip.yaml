      locator: 1. Introduction
      says: "in deep flexion the hip has a large range of external rotation but is at risk of impingement in internal rotation"
      says_kind: quote
    - ref: van-arkel-2015
      locator: 3. Results, first paragraph. Gives the upper end of the when range, nine cadaver hips under 5 N m torque.
      says: "Under 5 N m torque the mean (± standard deviation) hip joint flexion was 112±10°"
      says_kind: quote
  checked_by: null

# Rows below were added on 2026-11-03, one or more for every hip muscle, each with its sources open.
# They wait for the physio like the rows above.
# role primary is used where a source calls the muscle a main or primary mover for that movement.
# Where no source ranks the muscle, the row asks the physio in review_note.
# Left out on purpose: rotation by the adductors, the hamstrings and iliopsoas. Hirano 2025 says
# textbooks and studies do not agree on adductor rotation, and the OERI table wording on these
# rotations does not match its own Movement column. The gaps are listed in the task report.
# The OERI tables are summarised in sentences. OERI prose is quoted, it is CC BY 4.0.

