# Obturator internus external rotation in Ito 2025, Table 2, N m: 0.59 at 0°, 0.60 at 15°,
# 0.59 at 30°, 0.53 at 45°, 0.43 at 60°, 0.32 at 75°, 0.20 at 90°, 0.11 at 105°.
# Piriformis in the same table: 0.40, 0.40, 0.32, 0.24, 0.13, 0.05, then -0.02 and -0.06.
# It stays an external rotator over the whole range the study tested, and it beats piriformis at every angle.
# Roles follow the piriformis rows. Piriformis is drafted primary while its torque is still sizable,
# 0.24 N m or more (0.32 or more if the physio picks 30 degrees), and secondary at 0.13 and below.
# By either cut-off obturator internus stays primary up to 75° (0.32) and falls below it at 90° (0.20).
# The study measured every 15°, so nothing is claimed between 75° and 90°.
- id: obturator-internus-hip-external-rotation
  structure: obturator-internus
  movement: hip-external-rotation
  load: working
  role: primary
  when:
    - {angle: hip.flexion, min: 0, max: 75}
  confidence: medium
  citations:
    - ref: oeri-human-anatomy-10-7
      locator: Section Gluteal Region Muscles That Move the Femur, paragraph after Table 1
      says: "Deep to the gluteus maximus, the piriformis, obturator internus, obturator externus, superior gemellus, inferior gemellus, and quadratus femoris laterally rotate the femur at the hip."
      says_kind: quote
    - ref: palmieri-2026
      locator: Discussion, paragraph on obturator internus
      says: "Although external rotation of the femur is its primary action, the OI also contributes to abduction of the flexed hip"
      says_kind: quote
    - ref: ito-2025
      locator: 3. Results, and Table 2 (external rotation torque at each hip flexion angle, mean ± SD, N m), rows Piriformis and Obturator internus
      says: "Obturator internus external rotation torque peaked at 15° of hip flexion and fell as the hip bent further. Table 2 gives 0.59 ± 0.20 N m at 0°, 0.59 ± 0.18 at 30°, 0.53 ± 0.16 at 45°, 0.43 ± 0.13 at 60° and 0.32 ± 0.11 at 75°. Piriformis gave less at every one of these angles, 0.40 ± 0.17 at 0° and 0.24 ± 0.06 at 45°."
      says_kind: summary
  checked_by: null
  review_note: "Physio: primary here is our reading of Ito 2025 Table 2, no source ranks the rotators. Obturator internus gives more external rotation torque than piriformis at every angle (0.59 vs 0.40 N m at 0 degrees, 0.53 vs 0.24 at 45, 0.43 vs 0.13 at 60). Its torque at 75 degrees (0.32) is still at least what piriformis has where it is drafted primary. Is primary from 0 to 75 degrees right, whichever answer you give on the piriformis 45 versus 30 question?"

