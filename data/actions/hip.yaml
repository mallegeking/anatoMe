- id: acetabular-labrum-hip-internal-rotation
  structure: acetabular-labrum
  movement: hip-internal-rotation
  load: pinched
  when:
    - {angle: hip.flexion, min: 90, max: 112}
  applies_to: hips with pincer-type impingement
  confidence: low
  citations:
    - ref: groh-2009
      locator: Etiology, paragraph on femoroacetabular impingement (FAI)
      says: "In pincer-type FAI the acetabulum covers too much of the femoral head. The femoral head-neck junction then hits the acetabular rim and the labrum gets pinched between femur and acetabulum."
      says_kind: summary
    - ref: groh-2009
      locator: Clinical presentation, paragraph on the anterior hip impingement test
      says: "The anterior hip impingement test, the most consistent exam finding in labral tears, starts lying on the back with hip and knee bent to 90°. The examiner then turns the hip inwards while pushing it into adduction."
      says_kind: summary
    - ref: van-arkel-2015
      locator: 1. Introduction
      says: "in deep flexion the hip has a large range of external rotation but is at risk of impingement in internal rotation"
      says_kind: quote
    - ref: van-arkel-2015
      locator: 3. Results, first paragraph. Gives the upper end of the when range, nine cadaver hips under 5 N m torque.
      says: "Under 5 N m torque the mean (± standard deviation) hip joint flexion was 112±10°"
      says_kind: quote
  checked_by: null
