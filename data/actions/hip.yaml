- id: acetabular-labrum-hip-internal-rotation
  structure: acetabular-labrum
  movement: hip-internal-rotation
  load: pinched
  when:
    - {angle: hip.flexion, min: 90, max: 112}
  confidence: low
  citations:
    - ref: groh-2009
      locator: Etiology, paragraph on femoroacetabular impingement (FAI). Describes hips with pincer-type FAI, not every hip.
      says: "Pincer-type FAI is the result of abutment of the femoral head–neck junction on the acetabular rim due to acetabular overcoverage causing pinching of the labrum between the femur and acetabulum."
    - ref: groh-2009
      locator: Clinical presentation, paragraph on the anterior hip impingement test
      says: "This is performed with the patient supine with the hip and knee at 90° of flexion. The hip is internally rotated while an adduction force is applied."
    - ref: van-arkel-2015
      locator: 1. Introduction
      says: "in deep flexion the hip has a large range of external rotation but is at risk of impingement in internal rotation"
    - ref: van-arkel-2015
      locator: 3. Results, first paragraph. Gives the upper end of the when range, nine cadaver hips under 5 N m torque.
      says: "Under 5 N m torque the mean (± standard deviation) hip joint flexion was 112±10°"
  checked_by: null
