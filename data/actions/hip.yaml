      locator: Table 1 (Gluteal Region Muscles That Move the Femur), Iliopsoas group, row Iliacus, and the section Gluteal Region Muscles That Move the Femur
      says: "The psoas major and iliacus make up the iliopsoas group. The table gives iliacus the target motions thigh flexion and lateral rotation."
    - ref: schenkel-2018
