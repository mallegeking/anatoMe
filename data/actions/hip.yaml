- id: piriformis-hip-external-rotation
  structure: piriformis
  movement: hip-external-rotation
  load: working
  role: primary
  when:
    - {angle: hip.flexion, min: 0, max: 75}
  confidence: medium
  citations:
    - ref: oeri-human-anatomy-10-7
      locator: Table 1 (Gluteal Region Muscles That Move the Femur), Lateral Rotators, row Piriformis
      says: "Piriformis is listed among the lateral rotators, target motion direction: lateral rotation."
    - ref: ito-2025
      locator: Abstract, and 3. Results, paragraph on external rotation torque (Table 2, Figure 4A)
      says: "External rotation torque of the piriformis, obturator internus, and conjoined tendon peaked at 15° hip flexion, and then decreased as the hip flexed. ... The piriformis switched its function from external to internal rotation of the hip between 75° and 90° of flexion."
  checked_by: null

- id: piriformis-hip-internal-rotation
  structure: piriformis
  movement: hip-internal-rotation
  load: working
  role: secondary
  when:
    - {angle: hip.flexion, min: 90, max: 105}
  confidence: medium
  citations:
    - ref: ito-2025
      locator: 3. Results, paragraph on external rotation torque (Table 2, Figure 4A), and 4. Discussion. Hips were tested from 0° to 105° of flexion.
      says: "The piriformis switched its function from external to internal rotation of the hip between 75° and 90° of flexion."
  checked_by: null

