- id: ischiofemoral-ligament-hip-internal-rotation
  structure: ischiofemoral-ligament
  movement: hip-internal-rotation
  load: stretched
  confidence: medium
  citations:
    - ref: baba-2022
      locator: Abstract, Conclusion. Tested at 0°, 30° and 60° of hip flexion in nine cadaver hips.
      says: "The ischiofemoral ligament primarily restricted the internal rotation of the hip joint."
    - ref: ng-2019
      locator: Anatomy section, first paragraph
      says: "The ischiofemoral ligament ... reinforce[s] the capsule during internal rotation in neutral positions as well as in combined flexion-adduction positions"
  checked_by: null

