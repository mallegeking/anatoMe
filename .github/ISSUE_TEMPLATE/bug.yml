name: Bug
description: Something in the app does not work.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      description: For example phone or laptop, and the system.
  - type: input
    id: browser
    attributes:
      label: Browser and version
