# Checks the knowledge base, the meshes and the tests on every push and pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Node packages
        run: npm ci

      - name: Validate data
        run: npm run validate

      - name: Check meshes against the data
        run: npm run check-models

      - name: Node tests
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The pipeline tests only need pytest. npm run test:py expects it in .venv.
      - name: Set up Python
        run: |
          python -m venv .venv
          .venv/bin/pip install pytest

      - name: Python tests
        run: npm run test:py
